name: CI

on:
  push:
    # The preview workflow owns equivalent quality gates for this branch and tag.
    branches: ['**', '!feat/macos-release']
    tags: ['v*', '!v*-macos.*']
  pull_request:
  # Manual runs let a maintainer re-check a gate without spending a commit on it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Windows quality gate
    if: github.head_ref != 'feat/macos-release'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Verify tracked documentation links
        run: npm run check:docs

      - name: Verify release harness safety contracts
        run: node --test scripts/v030-release-harness.test.mjs scripts/supply-chain-contract.test.mjs

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run Rust lint checks
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked --all-targets --features runtime-evidence

  supply-chain:
    name: Dependency, license and SBOM gate
    if: github.head_ref != 'feat/macos-release'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit Rust advisories, sources, bans and licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 / cargo-deny 0.20.2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check
          arguments: --all-features
          command-arguments: advisories bans licenses sources
          rust-version: 1.94.1

      - name: Install verified CycloneDX generator
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-cyclonedx-0.5.9-linux.tar.xz"
          extract_root="$RUNNER_TEMP/cargo-cyclonedx-0.5.9-linux"
          curl --fail --location --silent --show-error \
            'https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-0.5.9/cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz' \
            --output "$archive"
          echo 'fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8  '"$archive" | sha256sum --check --strict
          mkdir -p "$extract_root"
          tar -xJf "$archive" -C "$extract_root"
          install -m 0755 \
            "$extract_root/cargo-cyclonedx-x86_64-unknown-linux-gnu/cargo-cyclonedx" \
            "$HOME/.cargo/bin/cargo-cyclonedx"
          cargo cyclonedx --version

      - name: Generate locked Rust CycloneDX SBOM
        working-directory: src-tauri
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          cargo cyclonedx \
            --format json \
            --spec-version 1.5 \
            --target x86_64-pc-windows-msvc \
            --override-filename codex-switch.cdx

      - name: Normalize workspace identity and validate SBOM
        run: |
          node scripts/check-sbom.mjs --prepare src-tauri/codex-switch.cdx.json
          node scripts/check-sbom.mjs src-tauri/codex-switch.cdx.json

      - name: Upload validated SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-switch-sbom-${{ github.sha }}
          path: src-tauri/codex-switch.cdx.json
          if-no-files-found: error
          retention-days: 14

  old-saved-slot-gate:
    name: v0.2.7 saved-slot apply gate
    if: github.head_ref != 'feat/macos-release'
    # Runs beside the quality gate instead of behind it: a gate that only exercises
    # the shipped v0.2.7 binary must not wait on a full clippy and test sweep.
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify v0.2.7 saved runtime slot apply on isolated runner
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/v030-old-saved-slot-ci.mjs (Join-Path $env:RUNNER_TEMP 'v030-old-saved-slot')

      - name: Upload old saved-slot apply evidence
        # Always upload: a failed gate is exactly when the launch logs are needed.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v030-old-saved-slot-apply-${{ github.sha }}
          path: ${{ runner.temp }}/v030-old-saved-slot/evidence
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Portable release build
    # macOS previews use macos-release.yml; never run the Windows release lane.
    if: github.ref != 'refs/heads/feat/macos-release' && github.head_ref != 'feat/macos-release' && !contains(github.ref, '-macos.')
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [quality, supply-chain, old-saved-slot-gate]
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1

      - name: Install frontend dependencies
        run: npm ci

      - name: Build portable release executable
        run: npm run tauri -- build

      - name: Verify uncompressed release contract
        run: npm run check:release

      - name: Fetch verified UPX 5.2.0
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'upx-5.2.0-win64.zip'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'upx-5.2.0-win64'
          Invoke-WebRequest `
            -Uri 'https://github.com/upx/upx/releases/download/v5.2.0/upx-5.2.0-win64.zip' `
            -OutFile $archive

          $expectedArchiveSha256 = 'B471EBF1B7F20F4A89150264ED9A008A2A5BFD247F3C6D1184A75BB59CA08F5D'
          $actualArchiveSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actualArchiveSha256 -ne $expectedArchiveSha256) {
            throw "UPX archive SHA-256 $actualArchiveSha256 does not match pinned $expectedArchiveSha256"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
          $upxPath = Join-Path $extractRoot 'upx-5.2.0-win64/upx.exe'
          $expectedUpxSha256 = 'F4C0CC7ACA0F1FF0D0B750E966B44139F2FA1A2DB7281F48FC52194400712E1D'
          $actualUpxSha256 = (Get-FileHash -LiteralPath $upxPath -Algorithm SHA256).Hash
          if ($actualUpxSha256 -ne $expectedUpxSha256) {
            throw "UPX executable SHA-256 $actualUpxSha256 does not match pinned $expectedUpxSha256"
          }
          "UPX_PATH=$upxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Pack and verify release executable
        shell: pwsh
        run: |
          ./scripts/pack-windows-release.ps1 `
            -UpxPath $env:UPX_PATH `
            -SourceExe 'src-tauri/target/release/codex-switch.exe' `
            -OutputExe 'release/codex-switch.exe'

      - name: Download validated SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-switch-sbom-${{ github.sha }}
          path: supply-chain

      - name: Attest executable build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/codex-switch.exe

      - name: Bind validated SBOM to executable
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/codex-switch.exe
          sbom-path: supply-chain/codex-switch.cdx.json

      - name: Upload verified packed executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-switch-${{ github.sha }}
          path: release/codex-switch.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-macos.')
    runs-on: windows-latest
    timeout-minutes: 15
    needs: release
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Download verified packed executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-switch-${{ github.sha }}
          path: release

      - name: Download validated SBOM for publication
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-switch-sbom-${{ github.sha }}
          path: release

      - name: Recheck downloaded release contracts
        run: |
          node scripts/check-release-contract.mjs release/codex-switch.exe
          node scripts/check-sbom.mjs release/codex-switch.cdx.json

      - name: Publish verified GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$version") {
            throw "tag $tag does not match package version v$version"
          }
          if ($version.Contains('-')) {
            throw 'The Windows Latest publisher only accepts stable release versions'
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "GitHub Release $tag already exists; refusing to replace a published asset"
          }

          $changelog = Get-Content CHANGELOG.md -Raw
          $escapedTag = [Regex]::Escape($tag)
          $pattern = "(?ms)^##\s+$escapedTag\s+-[^\r\n]*\r?\n(?<body>.*?)(?=^##\s+v|\z)"
          $match = [Regex]::Match($changelog, $pattern)
          if (-not $match.Success) {
            throw "CHANGELOG.md does not contain a release section for $tag"
          }
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText(
            $notesPath,
            $match.Groups['body'].Value.Trim() + [Environment]::NewLine,
            [Text.UTF8Encoding]::new($false)
          )

          $asset = Resolve-Path 'release/codex-switch.exe'
          $sbom = Resolve-Path 'release/codex-switch.cdx.json'
          $assetInfo = Get-Item -LiteralPath $asset
          $assetSha256 = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash
          $sbomSha256 = (Get-FileHash -LiteralPath $sbom -Algorithm SHA256).Hash
          Write-Output "RELEASE_ASSET_BYTES=$($assetInfo.Length)"
          Write-Output "RELEASE_ASSET_SHA256=$assetSha256"
          Write-Output "RELEASE_SBOM_SHA256=$sbomSha256"

          gh release create $tag $asset $sbom `
            --verify-tag `
            --title "ChatGPT Switch $tag" `
            --notes-file $notesPath `
            --latest

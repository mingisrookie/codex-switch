[package]
name = "codex-switch"
version = "0.5.0-macos.1"
edition = "2021"
rust-version = "1.94.1"
license = "MIT"
publish = false

[lib]
name = "codex_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
runtime-evidence = []

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tauri = { version = "=2.11.3", default-features = false, features = ["wry", "common-controls-v6"] }
toml_edit = "=0.23.10"
rusqlite = { version = "=0.37.0", features = ["backup", "bundled"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "native-tls"] }
sha2 = "=0.10.9"
walkdir = "=2.5.0"
base64 = "=0.22.1"
url = "=2.5.8"
semver = "=1.0.28"
zip = { version = "=4.6.1", default-features = false }
thiserror = "=2.0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["ApplicationModel", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.186"
core-foundation = "=0.10.1"
plist = "=1.10.0"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSRunningApplication", "libc"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSDate"] }
security-framework = "=3.7.0"
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
zeroize = "=1.9.0"

[dev-dependencies]
tempfile = "=3.27.0"
proptest = "=1.11.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
